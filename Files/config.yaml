cross_border:
  enable: true
  carrier: cross-border
  ntc_gw: 2.45
  marginal_cost: 60
  p_nom_mw: 1000000
  buses: ["89", "55", "1469"] # Default buses near EU neighbours

scenario_analysis: 
  rdir_name: "" # Name of subdirectory where output is stored
  Modelling_year: 2024
  snapshots_start: "2013-07-01" # Must be in 2013, as that is the weather reference year
  snapshots_end: "2013-07-02" # End date exclusive
  attacks_file: "" # Must conatain coordinates and dates
  generation:
    gen_radius: 3 # (kilometers) Radius from a generation bus within which an attack must fall to be considered damaging.
    gen_damage_percentage: 0.5 # Percentage of generation capacity assumed to be lost after an attack in the vicinity.
    days_to_repair: 3650 # Number of days assumed to repair damaged generation infrastructure, during which it is considered non-operational.
  transmission:
    trans_radius: 3 # (kilometers) Radius from a line or transformer within which an attack must fall to be considered damaging.
    trans_damage_percentage: 0 # Percentage of transmission capacity assumed to be lost after an attack in the vicinity.
    days_to_repair: 0 # Number of days assumed to repair damaged transmission infrastructure, during which it is considered non-operational.
